*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f7c6e6;font-family:B,'Baloo 2',system-ui,sans-serif;font-weight:800;touch-action:manipulation;overscroll-behavior:none}
#bg{position:fixed;top:0;right:0;bottom:0;left:0;background:#f7c6e6 center/cover no-repeat;transition:background-image .3s}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.scr{position:absolute;top:0;right:0;bottom:0;left:0;display:none}.scr.on{display:block}
.btn{position:absolute;border:0;border-radius:36px;background:linear-gradient(#fff,#ffe3f4);box-shadow:0 8px 0 #e58cc4,0 12px 24px rgba(120,40,100,.25);font:inherit;color:#b03a8a;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.btn:active,.btn.pr{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #e58cc4}
.back{left:24px;top:22px;width:120px;height:110px;font-size:64px;z-index:50}
.hub{width:250px;height:230px;flex-direction:column;font-size:110px;line-height:1}
.hub small{font-size:0}
