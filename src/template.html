@font-face{font-family:B;src:url(data:font/woff;base64,/*__FONT__*/) format('woff');font-weight:800}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f7c6e6;font-family:B,'Baloo 2',system-ui,sans-serif;font-weight:800;touch-action:manipulation;overscroll-behavior:none}
#bg{position:fixed;inset:0;background:#f7c6e6 center/cover no-repeat;transition:background-image .3s}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.btn{position:absolute;border:0;border-radius:36px;background:linear-gradient(#fff,#ffe3f4);box-shadow:0 8px 0 #e58cc4,0 12px 24px rgba(120,40,100,.25);font:inherit;color:#b03a8a;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}

.back{left:24px;top:22px;width:120px;height:110px;font-size:64px;z-index:50}
.hub{width:250px;height:230px;flex-direction:column;font-size:110px;line-height:1}
.hub small{font-size:0}
.ch{position:absolute;transform-origin:50% 100%;pointer-events:auto}
.ch svg{width:100%;height:100%;overflow:visible;display:block}
.sw{position:absolute;width:96px;height:96px;border-radius:50%;border:8px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.2);cursor:pointer}
.sw.sel{outline:8px solid #ff5fb4;outline-offset:2px}
.fx{position:absolute;pointer-events:none;font-size:56px;z-index:80;animation:fx 1.1s ease-out forwards}
@keyframes fx{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(180deg)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-14px)}}
.dance{animation:dance .9s ease-in-out infinite}@keyframes dance{25%{transform:rotate(-8deg) translateY(-20px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(8deg) translateY(-20px)}}
.spin{animation:spin .8s ease-in-out}@keyframes spin{50%{transform:scaleX(-1) translateY(-40px)}}
.hop{animation:hop .6s ease-out}@keyframes hop{40%{transform:translateY(-60px) scale(1.06)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.08)}}
#ttl{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:110px;color:#fff;-webkit-text-stroke:6px #d0459b;paint-order:stroke fill;text-shadow:0 8px 0 #a83079;letter-spacing:2px}
#stk{position:absolute;right:24px;top:22px;height:90px;padding:0 26px;border-radius:45px;background:rgba(255,255,255,.85);font-size:52px;color:#c2378f;display:flex;align-items:center;gap:8px;z-index:50;box-shadow:0 6px 16px rgba(0,0,0,.15)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.night{position:absolute;inset:0;background:rgba(20,10,60,.55);pointer-events:none;transition:opacity 1s}
.item{position:absolute;font-size:90px;cursor:pointer;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.lbl{position:absolute;font-size:30px;color:#fff;text-align:center;-webkit-text-stroke:3px #b03a8a;paint-order:stroke fill;pointer-events:none;white-space:nowrap}
